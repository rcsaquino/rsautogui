# Publishes rsautogui to crates.io via Trusted Publishing (OIDC, no tokens).
#
# One-time setup (already done): on crates.io, add this repo as a trusted
# publisher for crate `rsautogui` with workflow filename `publish.yml`.
# IMPORTANT: if this file is ever renamed, the trusted publisher entry on
# crates.io must be updated to match, or publishing will be rejected.
#
# How to release a new version:
#   1. Bump `version` in Cargo.toml.
#   2. Push a matching tag: `git tag v0.3.0 && git push origin v0.3.0`.
#
# The workflow verifies the crate on Linux/Windows/macOS first, checks the
# tag matches Cargo.toml, mints a short-lived crates.io token via OIDC,
# then runs `cargo publish`. Manual runs from the Actions tab only verify
# packaging (`cargo publish --dry-run`).

name: Publish to crates.io

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy (warnings denied)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # `id-token: write` is required for the OIDC exchange with crates.io.
    # If the crates.io trusted publisher entry restricts publishing to a
    # GitHub environment, also add `environment: <name>` here.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          echo "tag version: $TAG"
          echo "Cargo.toml version: $VER"
          if [[ "$TAG" != "$VER" ]]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $VER"
            exit 1
          fi

      - name: Verify packaging only (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: cargo publish --dry-run

      - name: Authenticate with crates.io (OIDC trusted publishing)
        if: startsWith(github.ref, 'refs/tags/v')
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Upload crate
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
